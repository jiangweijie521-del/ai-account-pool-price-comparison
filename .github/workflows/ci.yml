name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run Python and client tests
        run: |
          python server.py --self-test
          python -m unittest -v server_test.py analytics_test.py ops_test.py
          python -m py_compile server.py server_test.py analytics_test.py ops.py ops_test.py browser_test.py launcher_test.py
          python launcher_test.py
          node --test analytics_client.test.mjs
      - name: Run deterministic browser test
        run: python browser_test.py

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install locked Worker dependencies
        run: npm ci --ignore-scripts
      - name: Test and build Worker fallback
        run: |
          npm test
          npm run prepare:public
          test ! -e public/admin.html
          npm run deploy:dry-run

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Execute Windows launcher test
        run: python launcher_test.py
